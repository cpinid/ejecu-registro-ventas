version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
