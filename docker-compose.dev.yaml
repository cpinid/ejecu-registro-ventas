# Usar explícitamente solo para desarrollo local.
services:
  mocks:
    build:
      context: .
      dockerfile: dev/mocks/Dockerfile
    ports:
      - "127.0.0.1:5142:8080"

  backend:
    environment:
      API_ENV: dev
      AUTH_JWKS_URL: http://mocks:8080/jwks
      AUTH_ISSUER: registro-ventas-dev
      AUTH_AUDIENCE: registro-ventas
      PRODUCTOS_URL: http://mocks:8080
      STOCK_URL: http://mocks:8080
      FRONTEND_URL: http://localhost:5140
    depends_on:
      mocks:
        condition: service_started
