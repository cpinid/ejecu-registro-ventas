name: registro-venta

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: registro_venta
      POSTGRES_USER: registro_venta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Santiago
    ports:
      - "127.0.0.1:5192:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registro_venta -d registro_venta"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: "8080"
      API_ENV: ${API_ENV}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      TZ: America/Santiago
    ports:
      - "127.0.0.1:5191:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      TZ: America/Santiago
    ports:
      - "127.0.0.1:5190:8080"
    depends_on:
      - backend

volumes:
  postgres_data: