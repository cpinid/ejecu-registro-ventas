name: registro-ventas
services:
  postgres:
    image: &postgres postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configurar}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, ventas, -d, ventas]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?configurar}
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?configurar}
    ports:
      - "127.0.0.1:5141:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:5140:8080"
    depends_on:
      backend:
        condition: service_started
  seed:
    image: *postgres
    profiles: [dev]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: ventas
      PGUSER: ventas
      PGPASSWORD: ${POSTGRES_PASSWORD:?configurar}
    volumes:
      - ./dev/seed.sql:/seed.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  datos:
