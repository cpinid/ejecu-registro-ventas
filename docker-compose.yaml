name: registro-ventas
services:
  postgres:
    image: ${POSTGRES_IMAGE:?fijar digest}
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configurar}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, ventas, -d, ventas]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE:?fijar digest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?configurar}
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - '127.0.0.1:5141:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - '127.0.0.1:5140:8080'
    depends_on:
      backend:
        condition: service_started
  mailpit:
    image: ${MAILPIT_IMAGE:?fijar digest}
    profiles: [dev]
    ports:
      - '127.0.0.1:8025:8025'
volumes:
  datos:
